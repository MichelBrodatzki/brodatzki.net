version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/ka1/kube1/services/actualbudget"
      - "/ka1/kube1/services/homeassistant"
      - "/ka1/kube1/services/kanidm"
      - "/ka1/kube1/services/mosquitto"
      - "/ka1/kube1/services/openwebui"
      - "/ka1/kube1/services/plex"
      - "/ka1/kube1/services/vikunja"
      - "/ka1/kube1/services/wealthfolio"
      - "/ka1/kube1/services/zigbee2mqtt"
    schedule:
      interval: "cron"
      cronjob: "0 3 * * *"
