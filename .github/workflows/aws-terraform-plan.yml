name: Terraform plan deployment to AWS

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "aws/services/**/*.tf"

env:
  AWS_REGION: "eu-central-1"
  TERRAFORM_VERSION: "1.14.7"

permissions:
  contents: read

concurrency:
  group: aws-terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      directories: ${{ steps.changed-directories.outputs.directories }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed Terraform directories
        id: changed-directories
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          directories="$({
            git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA" -- 'aws/services/**/*.tf' |
              awk -F/ 'NF >= 4 { print $1 "/" $2 "/" $3 }' |
              sort -u
          } | jq -R -s -c 'split("\n") | map(select(length > 0))')"

          while IFS= read -r directory; do
            if [[ ! -d "$directory" ]]; then
              echo "::error::Terraform root $directory was deleted. Destroy its resources explicitly before removing the directory."
              exit 1
            fi
          done < <(jq -r '.[]' <<<"$directories")

          echo "directories=$directories" >>"$GITHUB_OUTPUT"

  plan:
    needs: changes
    if: needs.changes.outputs.directories != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        directory: ${{ fromJSON(needs.changes.outputs.directories) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::891920435804:role/github-actions-terraform-state-readonly
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "891920435804"
          mask-aws-account-id: true

      - name: Execute Terraform plan
        working-directory: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform validate
          terraform plan -input=false -lock=false
