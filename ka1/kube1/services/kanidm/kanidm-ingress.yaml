apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kanidm-gateway-tls
spec:
  secretName: kanidm-gateway-tls
  issuerRef:
    name: clusterissuer-cloudflare-acme-prod
    kind: ClusterIssuer
  dnsNames:
    - brodatzki.id
    - ka1.brodatzki.id
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kanidm-https-gateway
spec:
  gatewayClassName: cilium
  infrastructure:
    labels:
      lb-pool: reserved
  addresses:
    - type: IPAddress
      value: 10.10.41.251
  listeners:
    - name: tls-base
      protocol: TLS
      port: 443
      hostname: "brodatzki.id"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: TLSRoute
    - name: tls-site
      protocol: TLS
      port: 443
      hostname: "ka1.brodatzki.id"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: TLSRoute
    - name: http-base
      protocol: HTTP
      port: 80
      hostname: "brodatzki.id"
      allowedRoutes:
        namespaces:
          from: Same
    - name: http-site
      protocol: HTTP
      port: 80
      hostname: "ka1.brodatzki.id"
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kanidm-http-to-https-redirect
spec:
  parentRefs:
    - name: kanidm-https-gateway
      sectionName: http-base
    - name: kanidm-https-gateway
      sectionName: http-site
  hostnames:
    - "brodatzki.id"
    - "ka1.brodatzki.id"
  rules:
    - filters:
      - type: RequestRedirect
        requestRedirect:
          scheme: https
          statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kanidm-service-route
spec:
  parentRefs:
    - name: kanidm-https-gateway
      sectionName: tls-base
    - name: kanidm-https-gateway
      sectionName: tls-site
  hostnames:
    - "brodatzki.id"
    - "ka1.brodatzki.id"
  rules:
    - backendRefs:
        - name: kanidm
          port: 8443
