apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 32Gi
---
apiVersion: v1
kind: Service
metadata:
  name: plex
spec:
  type: ClusterIP
  ports:
    - port: 32400
      targetPort: 32400
  selector:
    app: plex
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      containers:
        - name: plex
          image: linuxserver/plex:1.43.3
          ports:
            - containerPort: 32400
          volumeMounts:
            - name: plex-config
              mountPath: /config
            - name: plex-movies
              mountPath: /media/movies
            - name: plex-series
              mountPath: /media/series
            - name: plex-music
              mountPath: /media/music
            - name: plex-audiobooks
              mountPath: /media/audiobooks
          env:
            - name: TZ
              value: Europe/Berlin
          imagePullPolicy: Always
      volumes:
        - name: plex-config
          persistentVolumeClaim:
            claimName: plex-config-pvc
        - name: plex-movies
          nfs:
            server: 10.10.40.2
            path: /movies
            readOnly: true
        - name: plex-series
          nfs:
            server: 10.10.40.2
            path: /series
            readOnly: true
        - name: plex-music
          nfs:
            server: 10.10.40.2
            path: /music
            readOnly: true
        - name: plex-audiobooks
          nfs:
            server: 10.10.40.2
            path: /audiobooks
            readOnly: true
