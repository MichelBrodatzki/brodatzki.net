apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: externalsecret-affine-oidc
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: affine-secretstore
    kind: SecretStore
  target:
    name: secret-affine-oidc
    template:
      engineVersion: v2
      data:
        config.json: |
          {
            "$schema": "https://github.com/toeverything/affine/releases/download/v0.27.3/config.schema.json",
            "server": {
              "name": "AFFiNE"
            },
            "flags": {
              "allowGuestDemoWorkspace": false
            },
            "auth": {
              "allowSignup": false,
              "allowSignupForOauth": true
            },
            "oauth": {
              "providers.oidc": {
                "clientId": {{ .client_id | toString | quote }},
                "clientSecret": {{ .client_secret | toString | quote }},
                "issuer": {{ .issuer | toString | quote }},
                "allowPrivateNetwork": true,
                "args": {
                  "scope": "openid profile email",
                  "claim_id": "sub",
                  "claim_email": "email",
                  "claim_name": "name",
                  "claim_email_verified": "email_verified"
                }
              }
            }
          }
  data:
    - secretKey: issuer
      remoteRef:
        key: /ka1/affine/oidc/issuer
    - secretKey: client_id
      remoteRef:
        key: /ka1/affine/oidc/client_id
    - secretKey: client_secret
      remoteRef:
        key: /ka1/affine/oidc/client_secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-storage-pvc
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 32Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-config-pvc
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: affine-redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app: affine-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: affine-redis
  template:
    metadata:
      labels:
        app: affine-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: affine
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3010
      targetPort: http
  selector:
    app: affine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: affine
  template:
    metadata:
      labels:
        app: affine
    spec:
      hostname: affine
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migration
          image: ghcr.io/toeverything/affine:0.27.3
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - node ./scripts/self-host-predeploy.js
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: REDIS_SERVER_HOST
              value: affine-redis
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cluster-affine-app
                  key: uri
            - name: AFFINE_INDEXER_ENABLED
              value: 'false'
            - name: AFFINE_SERVER_EXTERNAL_URL
              value: https://affine.ka1.brodatzki.net
          volumeMounts:
            - name: storage
              mountPath: /root/.affine/storage
            - name: config
              mountPath: /root/.affine/config
            - name: oidc-config
              mountPath: /root/.affine/config/config.json
              subPath: config.json
              readOnly: true
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 4Gi
      containers:
        - name: affine
          image: ghcr.io/toeverything/affine:0.27.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3010
          env:
            - name: REDIS_SERVER_HOST
              value: affine-redis
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cluster-affine-app
                  key: uri
            - name: AFFINE_INDEXER_ENABLED
              value: 'false'
            - name: AFFINE_SERVER_EXTERNAL_URL
              value: https://affine.ka1.brodatzki.net
          volumeMounts:
            - name: storage
              mountPath: /root/.affine/storage
            - name: config
              mountPath: /root/.affine/config
            - name: oidc-config
              mountPath: /root/.affine/config/config.json
              subPath: config.json
              readOnly: true
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 4Gi
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: affine-storage-pvc
        - name: config
          persistentVolumeClaim:
            claimName: affine-config-pvc
        - name: oidc-config
          secret:
            secretName: secret-affine-oidc
            defaultMode: 0400
