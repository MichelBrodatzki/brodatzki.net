apiVersion: v1
kind: ServiceAccount
metadata:
  name: openwebui-secrets-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::891920435804:role/ka1-k8s-secrets-readonly
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openwebui-secretstore
spec:
  provider:
    aws:
      service: ParameterStore
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: openwebui-secrets-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: externalsecret-openwebui-oidc
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: openwebui-secretstore
    kind: SecretStore
  target:
    name: secret-openwebui-oidc
  data:
    - secretKey: webui_key
      remoteRef:
        key: /ka1/openwebui/webuikey
    - secretKey: discovery
      remoteRef:
        key: /ka1/openwebui/oidc/discovery
    - secretKey: client_id
      remoteRef:
        key: /ka1/openwebui/oidc/client_id
    - secretKey: client_secret
      remoteRef:
        key: /ka1/openwebui/oidc/client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: externalsecret-openwebui-model-apis
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: openwebui-secretstore
    kind: SecretStore
  target:
    name: secret-openwebui-model-apis
  data:
    - secretKey: base_urls
      remoteRef:
        key: /ka1/openwebui/openai/base_urls
    - secretKey: api_keys
      remoteRef:
        key: /ka1/openwebui/openai/api_keys
    - secretKey: configs
      remoteRef:
        key: /ka1/openwebui/openai/configs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openwebui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: openwebui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      hostname: openwebui
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:v0.10.2
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: openwebui-data
              mountPath: /app/backend/data
          imagePullPolicy: Always
          env:
            - name: CORS_ALLOW_ORIGIN
              value: https://openwebui.ka1.brodatzki.net
            - name: WEBUI_URL
              value: https://openwebui.ka1.brodatzki.net
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cluster-openwebui-app
                  key: uri
            - name: ENABLE_PERSISTENT_CONFIG
              value: 'False'
            - name: ENABLE_CHANNELS
              value: 'True'
            - name: ENABLE_OLLAMA_API
              value: 'False'
            - name: ENABLE_OPENAI_API
              value: 'True'
            - name: DEFAULT_MODELS
              value: 'claude-sonnet-5'
            - name: OPENAI_API_BASE_URLS
              valueFrom:
                secretKeyRef:
                  name: secret-openwebui-model-apis
                  key: base_urls
            - name: OPENAI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: secret-openwebui-model-apis
                  key: api_keys
            - name: OPENAI_API_CONFIGS
              valueFrom:
                secretKeyRef:
                  name: secret-openwebui-model-apis
                  key: configs
            - name: ENABLE_IMAGE_GENERATION
              value: 'True'
            - name: IMAGE_GENERATION_MODEL
              value: 'gpt-image-2'
            - name: IMAGE_EDIT_MODEL
              value: 'gpt-image-2'
            - name: IMAGE_SIZE
              value: 'auto'
            - name: ENABLE_LOGIN_FORM
              value: 'False'
            - name: ENABLE_SIGNUP
              value: 'False'
            - name: ENABLE_OAUTH_SIGNUP
              value: 'True'
            - name: ENABLE_PASSWORD_AUTH
              value: 'False'
            - name: ENABLE_PASSWORD_CHANGE_FORM
              value: 'False'
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: 'True'
            - name: ENABLE_OAUTH_ID_TOKEN_COOKIE
              value: 'False'
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-openwebui-oidc
                  key: webui_key
            - name: OPENID_PROVIDER_URL
              valueFrom:
                secretKeyRef:
                  name: secret-openwebui-oidc
                  key: discovery
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: secret-openwebui-oidc
                  key: client_id
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret-openwebui-oidc
                  key: client_secret
            - name: OAUTH_PROVIDER_NAME
              value: 'Brodatzki ID'
            - name: OPENID_REDIRECT_URI
              value: 'https://openwebui.ka1.brodatzki.net/oauth/oidc/callback'
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: 'True'
            - name: OAUTH_ROLES_CLAIM
              value: 'account_role'
            - name: OAUTH_ALLOWED_ROLES
              value: 'user,admin'
            - name: OAUTH_ADMIN_ROLES
              value: 'admin'
            - name: OAUTH_CODE_CHALLENGE_METHOD
              value: 'S256'
      volumes:
        - name: openwebui-data
          persistentVolumeClaim:
            claimName: openwebui-data-pvc