---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-tunnel-config-provider
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-tunnel-config-provider-gateway-reader
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-tunnel-config-provider-gateway-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-tunnel-config-provider-gateway-reader
subjects:
  - kind: ServiceAccount
    name: traefik-tunnel-config-provider
    namespace: traefik-tunnel-config-provider
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-tunnel-config-provider
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app: traefik-tunnel-config-provider
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-tunnel-config-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik-tunnel-config-provider
  template:
    metadata:
      labels:
        app: traefik-tunnel-config-provider
    spec:
      serviceAccountName: traefik-tunnel-config-provider
      hostname: traefik-tunnel-config-provider
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik-tunnel-config-provider
          image: ghcr.io/michelbrodatzki/traefik-tunnel-config-provider/traefik-tunnel-config-provider:v1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
