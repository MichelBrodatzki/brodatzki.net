apiVersion: v1
kind: ServiceAccount
metadata:
  name: vikunja-secrets-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::891920435804:role/ka1-k8s-secrets-readonly
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vikunja-secretstore
spec:
  provider:
    aws:
      service: ParameterStore
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: vikunja-secrets-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: externalsecret-vikunja
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: vikunja-secretstore
    kind: SecretStore
  target:
    name: secret-vikunja
  data:
    - secretKey: service_secret
      remoteRef:
        key: /ka1/vikunja/service_secret
    - secretKey: auth_url
      remoteRef:
        key: /ka1/vikunja/oidc/auth_url
    - secretKey: client_id
      remoteRef:
        key: /ka1/vikunja/oidc/client_id
    - secretKey: client_secret
      remoteRef:
        key: /ka1/vikunja/oidc/client_secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vikunja-config
data:
  config.yml: |
    auth:
      openid:
        providers:
          brodatzki:
            name: Brodatzki ID
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vikunja-files-pvc
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vikunja
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3456
      targetPort: 3456
  selector:
    app: vikunja
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vikunja
  template:
    metadata:
      labels:
        app: vikunja
    spec:
      hostname: vikunja
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vikunja
          image: vikunja/vikunja:2.4.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3456
          volumeMounts:
            - name: vikunja-files
              mountPath: /app/vikunja/files
            - name: vikunja-config
              mountPath: /app/vikunja/config.yml
              subPath: config.yml
              readOnly: true
          imagePullPolicy: Always
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          env:
            - name: VIKUNJA_SERVICE_PUBLICURL
              value: https://vikunja.ka1.brodatzki.net/
            - name: VIKUNJA_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret-vikunja
                  key: service_secret
            - name: VIKUNJA_SERVICE_ENABLEREGISTRATION
              value: 'false'
            - name: VIKUNJA_SERVICE_TIMEZONE
              value: Europe/Berlin
            - name: VIKUNJA_DEFAULTSETTINGS_TIMEZONE
              value: Europe/Berlin
            - name: VIKUNJA_DATABASE_TYPE
              value: postgres
            - name: VIKUNJA_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: cluster-vikunja-app
                  key: host
            - name: VIKUNJA_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: cluster-vikunja-app
                  key: username
            - name: VIKUNJA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cluster-vikunja-app
                  key: password
            - name: VIKUNJA_DATABASE_DATABASE
              valueFrom:
                secretKeyRef:
                  name: cluster-vikunja-app
                  key: dbname
            - name: VIKUNJA_FILES_BASEPATH
              value: /app/vikunja/files
            - name: VIKUNJA_AUTH_LOCAL_ENABLED
              value: 'false'
            - name: VIKUNJA_AUTH_OPENID_ENABLED
              value: 'true'
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_BRODATZKI_NAME
              value: Brodatzki ID
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_BRODATZKI_AUTHURL
              valueFrom:
                secretKeyRef:
                  name: secret-vikunja
                  key: auth_url
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_BRODATZKI_CLIENTID
              valueFrom:
                secretKeyRef:
                  name: secret-vikunja
                  key: client_id
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_BRODATZKI_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: secret-vikunja
                  key: client_secret
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_BRODATZKI_SCOPE
              value: openid profile email
      volumes:
        - name: vikunja-files
          persistentVolumeClaim:
            claimName: vikunja-files-pvc
        - name: vikunja-config
          configMap:
            name: vikunja-config
