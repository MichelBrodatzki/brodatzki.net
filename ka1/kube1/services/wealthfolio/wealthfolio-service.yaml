apiVersion: v1
kind: ServiceAccount
metadata:
  name: wealthfolio-secrets-sa 
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::891920435804:role/ka1-k8s-secrets-readonly
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: wealthfolio-secretstore
spec:
  provider:
    aws:
      service: ParameterStore
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: wealthfolio-secrets-sa
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wealthfolio-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 4Gi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: externalsecret-wealthfolio-secrets
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: wealthfolio-secretstore
    kind: SecretStore
  target:
    name: secret-wealthfolio
  data:
    - secretKey: secret_key
      remoteRef:
        key: /ka1/wealthfolio/secret_key
    - secretKey: auth_pw_hash
      remoteRef:
        key: /ka1/wealthfolio/auth_pw_hash
---
apiVersion: v1
kind: Service
metadata:
  name: wealthfolio
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8088
      targetPort: 8088
  selector:
    app: wealthfolio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealthfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wealthfolio
  template:
    metadata:
      labels:
        app: wealthfolio
    spec:
      hostname: wealthfolio
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wealthfolio
          image: ghcr.io/wealthfolio/wealthfolio:3.5.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8088
          volumeMounts:
            - name: wealthfolio-data
              mountPath: /data
          env:
            - name: WF_LISTEN_ADDR
              value: "0.0.0.0:8088"
            - name: WF_DB_PATH
              value: "/data/wealthfolio.db"
            - name: WF_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-wealthfolio
                  key: secret_key
            - name: WF_AUTH_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: secret-wealthfolio
                  key: auth_pw_hash
            - name: WF_AUTH_TOKEN_TTL_MINUTES
              value: "1440"
            - name: WF_CORS_ALLOW_ORIGINS
              value: "https://wealthfolio.ka1.brodatzki.net"
          imagePullPolicy: Always
      volumes:
        - name: wealthfolio-data
          persistentVolumeClaim:
            claimName: wealthfolio-data-pvc